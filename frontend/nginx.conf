server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 关键：nginx 默认只在启动时解析一次 upstream 域名。
    # Docker 里 backend 容器重启会换 IP，nginx 仍拿着旧 IP，接口就返回 502。
    # 用 Docker 内置 DNS + 变量 proxy_pass，nginx 会按 TTL 重新解析。
    # ipv6=off：避免 Docker Desktop 上解析出 IPv6 但容器未监听导致连接失败。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # SSE 必须关闭缓冲，否则前端会「卡住然后一次性刷出」
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # 关键：不要让上游压缩 SSE。一旦响应被 gzip，nginx 需要攒够一块才能解压转发，
        # 表现就是打字机效果消失、整段一次性出现。这两行必须放在 /api/ 里。
        proxy_set_header Accept-Encoding "";
        gzip off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        # 变量 proxy_pass 下仍要显式关掉临时文件缓冲，避免大响应落盘攒包
        proxy_max_temp_file_size 0;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
